<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Vite does not use %PUBLIC_URL% -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10213b" />
    <meta name="description" content="GFAMOUS MINERAL MARKET is a marketplace connecting gold and mineral buyers and sellers. Browse approved listings, compare prices and weights, explore locations, and submit mineral listings." />

    <!--
    Runtime environment variables
    These values are:
    - replaced in DEV by Vite (via import.meta.env if needed)
    - replaced in PROD by Docker entrypoint (string replace)
  -->
    <script>
      window.__ENV = {
        backendURL: "$$BACKEND_URL$$",
        appWalletAddress: "$$APP_WALLET_ADDRESS$$",
      };
    </script>

    <!-- Pi Network SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <script>
      Pi.init({ version: "2.0" });
    </script>

    <title>GFAMOUS MINERAL MARKET | Gold & Mineral Marketplace</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Vite entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
